spring.application.name=smart-home
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/smart_home
spring.datasource.username=root
spring.datasource.password=123456

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# MQTT
mqtt.broker-url=tcp://localhost:1884
mqtt.client-id=smart-home-backend
mqtt.username=${MQTT_USERNAME}
mqtt.password=${MQTT_PASSWORD}
mqtt.sensor-topic=sensor/data
mqtt.action-status-topic=device/status/+
mqtt.qos=1

user-id=1

device.command.timeout-seconds=30
device.command.timeout-scan-delay-ms=5000

websocket.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Demo sensor alert thresholds
sensor.thresholds.temperature.lower=18
sensor.thresholds.temperature.upper=35

sensor.thresholds.humidity.lower=30
sensor.thresholds.humidity.upper=80

sensor.thresholds.light.lower=100
sensor.thresholds.light.upper=1000
